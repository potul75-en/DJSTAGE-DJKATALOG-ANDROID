name: DJKATALOG Android - signed production APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.DJAPP_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.DJAPP_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.DJAPP_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DJAPP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_ALIAS"
          test -n "$KEYSTORE_PASS" && test -n "$KEY_PASS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/djkatalog-release.jks"
          test -s "$RUNNER_TEMP/djkatalog-release.jks"
      - name: Compile production release
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Align, sign, verify and export APK
        env:
          KEYSTORE_ALIAS: ${{ secrets.DJAPP_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.DJAPP_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DJAPP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p output
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK/apksigner" sign --ks "$RUNNER_TEMP/djkatalog-release.jks" --ks-key-alias "$KEYSTORE_ALIAS" --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --out output/DJKATALOG-Android-v3.0.0.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK/apksigner" verify --verbose --print-certs output/DJKATALOG-Android-v3.0.0.apk
          "$SDK/aapt" dump badging output/DJKATALOG-Android-v3.0.0.apk | grep "package: name='pl.djstage.djkatalog'"
          (cd output && sha256sum DJKATALOG-Android-v3.0.0.apk > DJKATALOG-Android-v3.0.0.apk.sha256)
      - name: Match previous production signing fingerprint
        env:
          EXPECTED_SHA256: '15dfa97e74978c0b89448569f488ba3815babbed24cda71bc0acd220c22deda2'
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs output/DJKATALOG-Android-v3.0.0.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing certificate fingerprint mismatch"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: DJKATALOG-Android-v3.0.0-SIGNED
          path: output/*
          if-no-files-found: error
          retention-days: 14
