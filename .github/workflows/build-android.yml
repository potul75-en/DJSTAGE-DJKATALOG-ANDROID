name: DJ-KATALOG Android - test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK from GitHub runner
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable TEST APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK exists and calculate checksum
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/DJKATALOG-Android-TEST.apk
          test -s output/DJKATALOG-Android-TEST.apk
          (cd output && sha256sum DJKATALOG-Android-TEST.apk > DJKATALOG-Android-TEST.apk.sha256)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/DJKATALOG-Android-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/DJKATALOG-Android-TEST.apk | grep "package: name='pl.djstage.djkatalog.test'"
      - uses: actions/upload-artifact@v4
        with:
          name: DJKATALOG-Android-TEST
          path: output/*
          if-no-files-found: error
          retention-days: 14
