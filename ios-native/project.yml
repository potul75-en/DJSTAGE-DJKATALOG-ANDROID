name: DJKATALOG
options:
  bundleIdPrefix: pl.djstage
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  DJKATALOG:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DJKATALOG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.djstage.djkatalog
        PRODUCT_NAME: DJKATALOG
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "310"
        MARKETING_VERSION: "3.1.0"
        INFOPLIST_FILE: DJKATALOG/Info.plist
        GENERATE_INFOPLIST_FILE: NO
